<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Открытка для ШОХА от Самира</title>

  <!-- Google Fonts: Современный минималистичный Montserrat + изящная каллиграфия Great Vibes и Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       1. ПЕРЕМЕННЫЕ И БАЗОВЫЕ СТИЛИ
       ========================================================== */
    :root {
      --primary-grad: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
      --accent-color: #ff2a5f;
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --shadow-soft: 0 30px 60px rgba(255, 105, 135, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at 50% 50%, #ffe3e8 0%, #ecc4ec 50%, #c4d7ff 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Анимированный фоновый Canvas */
    #canvas-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 3D Сцена */
    .scene {
      position: relative;
      width: 380px;
      height: 540px;
      perspective: 2000px;
      z-index: 2;
    }

    /* ==========================================================
       2. МОДЕРНИЗИРОВАННАЯ КНИЖНАЯ 3D-КОНСТРУКЦИЯ
       ========================================================== */
    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out; /* Для плавного параллакса */
    }

    /* Левая обложка (поворотная) */
    .cover {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
      z-index: 3;
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
    }

    .book.opened .cover {
      transform: rotateY(-180deg);
    }

    /* Лицевая и задняя части обложки */
    .cover-front, .cover-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 25px;
      text-align: center;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }

    .cover-back {
      transform: rotateY(180deg);
      background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,240,245,0.9));
    }

    /* Внутренний разворот (база открытки) */
    .inside-page {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-soft);
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      z-index: 1;
    }

    /* ==========================================================
       3. ДЕТАЛИ ИНТЕРФЕЙСА И ДЕКОР
       ========================================================== */
    .badge {
      background: rgba(255, 42, 95, 0.1);
      color: var(--accent-color);
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .sender-tag {
      font-family: 'Caveat', cursive;
      font-size: 3.2rem;
      color: #2c2c2c;
      font-weight: 700;
      margin-top: 10px;
    }

    .sender-tag span {
      background: var(--primary-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Кнопка Сердца с пульсацией и неоновым свечением */
    .heart-wrapper {
      position: relative;
      cursor: pointer;
      margin: 20px 0;
    }

    .heart-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      background: var(--accent-color);
      border-radius: 50%;
      filter: blur(25px);
      opacity: 0.4;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .heart-btn {
      width: 90px;
      height: 90px;
      background: var(--primary-grad);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(255, 42, 95, 0.4);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      z-index: 2;
    }

    .heart-btn:hover {
      transform: scale(1.12);
    }

    .heart-btn svg {
      width: 45px;
      height: 45px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.2));
      animation: heartBeat 1.4s infinite;
    }

    .hint-text {
      font-size: 0.85rem;
      color: #777;
      font-weight: 500;
      letter-spacing: 1px;
    }

    /* ==========================================================
       4. ВНУТРЕННЕЕ НАПОЛНЕНИЕ (ПРИЗНАНИЕ)
       ========================================================== */
    .main-title {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      line-height: 1.2;
      color: #1a1a1a;
      margin-top: 10px;
    }

    .main-title .highlight {
      color: var(--accent-color);
      display: block;
      font-size: 3.2rem;
    }

    .compliment-box {
      background: rgba(255, 255, 255, 0.6);
      border: 1px dashed rgba(255, 42, 95, 0.3);
      padding: 15px 20px;
      border-radius: 16px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 15px 0;
      width: 100%;
    }

    .compliment-text {
      font-size: 0.95rem;
      color: #555;
      font-style: italic;
      transition: opacity 0.3s ease;
    }

    .recipient-title {
      font-family: 'Great Vibes', cursive;
      font-size: 2.6rem;
      background: var(--primary-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .action-btn {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .action-btn:hover {
      background: var(--accent-color);
      color: #fff;
    }

    .reset-link {
      font-size: 0.75rem;
      color: #aaa;
      cursor: pointer;
      border: none;
      background: none;
      text-decoration: underline;
    }

    /* ==========================================================
       5. КЛЮЧЕВЫЕ КАДРЫ (KEYFRAMES)
       ========================================================== */
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.6; }
    }

    @media (max-width: 420px) {
      .scene { width: 320px; height: 480px; }
      .sender-tag { font-size: 2.6rem; }
      .main-title { font-size: 2.2rem; }
      .main-title .highlight { font-size: 2.6rem; }
    }
  </style>
</head>
<body>

  <!-- Динамический Canvas с партиклами -->
  <canvas id="canvas-bg"></canvas>

  <div class="scene">
    <div class="book" id="book">

      <!-- Поворотная обложка -->
      <div class="cover">
        <div class="cover-front">
          <span class="badge">Особое послание</span>

          <div class="sender-tag">От <span>Самира</span></div>

          <div class="heart-wrapper" id="openBtn">
            <div class="heart-glow"></div>
            <div class="heart-btn">
              <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
            </div>
          </div>

          <p class="hint-text">Нажми на сердечко</p>
        </div>

        <div class="cover-back">
          <!-- Тыльная сторона обложки при развороте -->
        </div>
      </div>

      <!-- Внутренняя страница открытки -->
      <div class="inside-page">
        <span class="badge">Признание</span>

        <h1 class="main-title">
          Если честно,<br>
          <span class="highlight">ты мне нравишься</span>
        </h1>

        <div class="compliment-box">
          <p class="compliment-text" id="complimentText">Ты украшаешь каждый день...</p>
        </div>

        <button class="action-btn" id="nextComplimentBtn">Ещё комплимент ✨</button>

        <div>
          <p class="recipient-title">для ШОХА</p>
          <button class="reset-link" id="closeBtn">Закрыть открытку</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    /* ==========================================================
       6. JAVASCRIPT: ИНТЕРАКТИВ, СИНТЕЗАТОР ЗВУКА И ЧАСТИЦЫ
       ========================================================== */

    const book = document.getElementById('book');
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const complimentText = document.getElementById('complimentText');
    const nextComplimentBtn = document.getElementById('nextComplimentBtn');
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');

    // Список романтических комплиментов для Нозы
    const compliments = [
      "Твоя улыбка делает этот мир намного ярче ✨",
      "Ты невероятно особенный и прекрасный человек 🌸",
      "Рядом с тобой время останавливается... 💫",
      "Ты вдохновляешь и даришь тепло каждым словом 💖",
      "У тебя самые невероятные и добрые глаза 🌟"
    ];

    let complimentIndex = 0;

    // Ресайз холста
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 3D Tilt эффект при движении мыши
    document.addEventListener('mousemove', (e) => {
      if (book.classList.contains('opened')) return;
      const x = (window.innerWidth / 2 - e.clientX) / 25;
      const y = (window.innerHeight / 2 - e.clientY) / 25;
      book.style.transform = `rotateY(${-x}deg) rotateX(${y}deg)`;
    });

    // Романтическая арпеджио-мелодия на Web Audio API
    function playRomanticChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();

        // Нотный аккорд (C Major 7)
        const notes = [523.25, 659.25, 783.99, 987.77, 1046.50];

        notes.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.12);

          gain.gain.setValueAtTime(0, audioCtx.currentTime + index * 0.12);
          gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + index * 0.12 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.12 + 1.2);

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start(audioCtx.currentTime + index * 0.12);
          osc.stop(audioCtx.currentTime + index * 0.12 + 1.2);
        });
      } catch (e) {
        console.log("Аудио заблокировано браузером до первого клика");
      }
    }

    // Физика частиц (сердечки и блестки)
    const particles = [];

    class Particle {
      constructor(x, y, isBurst = false) {
        this.x = x || Math.random() * canvas.width;
        this.y = y || canvas.height + 20;
        this.size = Math.random() * 12 + 6;
        this.color = ['#ff2a5f', '#ff758c', '#ffb6c1', '#ffffff', '#ffd700'][Math.floor(Math.random() * 5)];

        if (isBurst) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 10 + 3;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.gravity = 0.15;
        } else {
          this.vx = (Math.random() - 0.5) * 1.2;
          this.vy = -Math.random() * 2 - 0.8;
          this.gravity = 0;
        }

        this.alpha = 1;
        this.rotation = Math.random() * Math.PI;
        this.isBurst = isBurst;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;

        ctx.beginPath();
        const topCurveHeight = this.size * 0.3;
        ctx.moveTo(0, topCurveHeight);
        ctx.bezierCurveTo(0, 0, -this.size / 2, 0, -this.size / 2, topCurveHeight);
        ctx.bezierCurveTo(-this.size / 2, (this.size + topCurveHeight) / 2, 0, this.size, 0, this.size);
        ctx.bezierCurveTo(0, this.size, this.size / 2, (this.size + topCurveHeight) / 2, this.size / 2, topCurveHeight);
        ctx.bezierCurveTo(this.size / 2, 0, 0, 0, 0, topCurveHeight);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.isBurst) this.vy += this.gravity;
        this.rotation += 0.03;

        if (this.isBurst) {
          this.alpha -= 0.012;
        } else if (this.y < -20) {
          this.y = canvas.height + 20;
          this.x = Math.random() * canvas.width;
        }
      }
    }

    // Инициализация фоновых сердечек
    for (let i = 0; i < 30; i++) {
      particles.push(new Particle(Math.random() * canvas.width, Math.random() * canvas.height));
    }

    function createBurst() {
      const rect = book.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      for (let i = 0; i < 60; i++) {
        particles.push(new Particle(cx, cy, true));
      }
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();

        if (particles[i].isBurst && particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    // События клика
    openBtn.addEventListener('click', () => {
      book.style.transform = `rotateY(0deg) rotateX(0deg)`;
      book.classList.add('opened');
      playRomanticChime();
      createBurst();
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      book.classList.remove('opened');
    });

    // Смена комплиментов
    nextComplimentBtn.addEventListener('click', () => {
      complimentText.style.opacity = '0';
      setTimeout(() => {
        complimentIndex = (complimentIndex + 1) % compliments.length;
        complimentText.innerText = compliments[complimentIndex];
        complimentText.style.opacity = '1';
      }, 300);
    });
  </script>
</body>
</html>
